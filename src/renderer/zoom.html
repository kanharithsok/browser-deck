<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas controls</title>
    <link rel="stylesheet" href="/src/assets/app.css" />
    <link rel="stylesheet" href="/src/zoom.css" />
  </head>
  <body>
    <section class="canvas-bar" aria-label="Canvas controls">
      <button
        id="hand"
        class="icon-button"
        type="button"
        title="Hand tool (hold Space)"
        aria-label="Hand tool"
        aria-pressed="false"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6 8V4.4a1 1 0 0 1 2 0V7M8 7V3.4a1 1 0 0 1 2 0V7M10 7V4.4a1 1 0 0 1 2 0V8M12 8V6.6a1 1 0 0 1 2 0v3.8a4.1 4.1 0 0 1-4.1 4.1H8.4a3.8 3.8 0 0 1-3-1.5l-2.2-2.9a1.1 1.1 0 0 1 1.8-1.2L6 11" />
        </svg>
      </button>
      <button
        id="select"
        class="icon-button"
        type="button"
        title="Select browsers (drag to select, Delete to close)"
        aria-label="Select browsers"
        aria-pressed="false"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 2.6 12 9.2l-3.9.4-2.1 3.7Z" fill="currentColor" />
        </svg>
      </button>
      <span class="bar-separator" aria-hidden="true"></span>
      <button id="out" class="icon-button" type="button" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.2" />
          <path d="m10.2 10.2 3 3M4.9 7h4.2" />
        </svg>
      </button>
      <button
        id="percent"
        class="percent-button"
        type="button"
        title="Choose zoom level"
        aria-label="Choose zoom level"
        aria-haspopup="menu"
      >
        <span id="value">100%</span>
        <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
          <path d="m4 6 4 4 4-4" />
        </svg>
      </button>
      <button id="in" class="icon-button" type="button" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.2" />
          <path d="m10.2 10.2 3 3M4.9 7h4.2M7 4.9v4.2" />
        </svg>
      </button>
      <span class="bar-separator" aria-hidden="true"></span>
      <button
        id="find"
        class="icon-button"
        type="button"
        title="Find browser (Cmd/Ctrl+K)"
        aria-label="Find browser"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" />
          <path d="m10.5 10.5 3 3" />
        </svg>
      </button>
      <button
        id="reload-all"
        class="icon-button"
        type="button"
        title="Reload all browsers"
        aria-label="Reload all browsers"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.2 6.4A5.5 5.5 0 1 0 13.5 8" />
          <path d="M13.4 3.2v3.4H10" />
        </svg>
      </button>
      <button
        id="arrange"
        class="icon-button"
        type="button"
        title="Arrange browsers"
        aria-label="Arrange browsers"
        aria-haspopup="menu"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2.2" y="2.8" width="4.8" height="4.4" rx="0.8" />
          <rect x="9" y="2.8" width="4.8" height="4.4" rx="0.8" />
          <rect x="2.2" y="9" width="4.8" height="4.4" rx="0.8" />
          <rect x="9" y="9" width="4.8" height="4.4" rx="0.8" />
        </svg>
      </button>
      <span class="bar-separator" aria-hidden="true"></span>
      <button
        id="appearance"
        class="icon-button appearance-button"
        type="button"
        title="Appearance: System"
        aria-label="Appearance: System"
        aria-haspopup="menu"
      >
        <svg data-theme-icon="system" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2.2" y="3" width="11.6" height="8" rx="1.3" />
          <path d="M5.5 13h5M8 11v2" />
        </svg>
        <svg data-theme-icon="light" viewBox="0 0 16 16" aria-hidden="true" hidden>
          <circle cx="8" cy="8" r="3.1" />
          <path d="M8 1.5v1.7M8 12.8v1.7M1.5 8h1.7M12.8 8h1.7M3.4 3.4l1.2 1.2M11.4 11.4l1.2 1.2M12.6 3.4l-1.2 1.2M4.6 11.4l-1.2 1.2" />
        </svg>
        <svg data-theme-icon="dark" viewBox="0 0 16 16" aria-hidden="true" hidden>
          <path d="M13.2 9.7A5.5 5.5 0 0 1 6.3 2.8 5.5 5.5 0 1 0 13.2 9.7Z" />
        </svg>
      </button>
    </section>

    <script type="module" src="/src/zoom.ts"></script>
  </body>
</html>
