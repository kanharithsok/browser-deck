name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Agent configuration
        run: npm run check:agent

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Contrast tokens
        run: npm run check:contrast

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Electron integration tests currently require a local GUI session and are
      # run with `npm run test:e2e` on macOS during development. Add a native
      # macOS runner job only after headless Electron execution is proven.
